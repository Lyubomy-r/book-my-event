#
# Spring properties
#
spring.application.name=BookMyEvent
server.port=8080
server.servlet.context-path=/api/v1
#
# Mongodb properties cloud connect
#
#spring.data.mongodb.uri=${MONGODB_URL}
spring.data.mongodb.uri=mongodb://rootuser:rootpass@localhost:27017/


debug=true

#
# Mongodb properties local connect
#
#spring.data.mongodb.username=rootpass
#spring.data.mongodb.password=rootuser
#spring.data.mongodb.host=localhost
#spring.data.mongodb.port=27017
spring.data.mongodb.database=testDB
spring.data.mongodb.authentication-database=admin

#
# Authentication properties
#
jwt.signing.key=${JWT_KEY}

#
# Mail service properties
#
cloud.server.url=${SERVER_URL}
#cloud.server.url=http://localhost:8080


server.swagger-ui.operationsSorter=method
server.swagger-ui.tagsSorter=alpha
server.swagger-ui.disable-swagger-default-url=false


#
# EMAIL HOST
#
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_ID}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.mime.charset=UTF-8
spring.mail.properties.mail.smtp.writetimeout= 10000
spring.mail.properties.mail.smtp.connectiontimeout= 10000
spring.mail.properties.mail.smtp.timeout= 10000
spring.mail.properties.mail.smtp.auth= true
spring.mail.properties.mail.smtp.starttls.enable= true
spring.mail.properties.mail.smtp.ssl.trust= smtp.gmail.com
spring.mail.properties.mail.smtp.starttls.required= true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

EMAIL_HOST= smtp.gmail.com
EMAIL_PORT= 587
